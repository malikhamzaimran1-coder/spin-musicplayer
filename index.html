<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin – Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="player" id="player">
  <div class="disc-wrap"><div class="disc"></div></div>
  <div class="title" id="title">Nothing playing</div>
  <div class="sub" id="sub">Add songs to start listening</div>

  <div class="seek">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button id="shuffle" title="Shuffle (S)" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.1 4.4L8.9 9.6A4 4 0 0 0 5.6 8H3V6h2.6c1.6 0 3.1.8 4 2.1L11 9.9 13.3 6.6A3 3 0 0 1 15.8 5H17V3zM3 16h2.6c1.3 0 2.5-.6 3.3-1.7l.4-.5 1.4 2-.2.3A5 5 0 0 1 5.6 18H3v-2zm14-1l4 4-4 4v-3h-1.2a5 5 0 0 1-4-2.1l1.4-2a3 3 0 0 0 2.6 1.1H17v-2z"/></svg></button>
    <button id="prev" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button id="play" title="Play / Pause (Space)" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="next" title="Next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button id="repeat" title="Repeat (R)" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
  </div>

  <div class="volume">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div>
  <div class="msg" id="msg" role="status"></div>

  <div class="list-head">
    <h2>Playlist <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <label class="add">Add songs
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac,.opus,.weba,.webm,.mp4" multiple>
    </label>
  </div>
  <ul id="list"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
